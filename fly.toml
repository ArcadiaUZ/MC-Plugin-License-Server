# fly.toml app configuration file generated for epic-license-server on 2026-07-13T21:38:05+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'epic-license-server'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_USERNAME = 'admin'
  DB_PATH = '/data/licenses.db'
  NODE_ENV = 'production'

[[mounts]]
  source = 'license_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/api/health'
    protocol = 'http'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
